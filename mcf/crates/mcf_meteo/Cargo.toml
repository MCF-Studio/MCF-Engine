[package]
name = "mcf_meteo"
description = "Météo et eau MCF : état météo, transitions (puis vent, pluie, neige, humidité, océan, nuages)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["rendu", "son"]
# Rendu (pluie, neige…). Le serveur dédié s'en passe : `default-features = false`.
rendu = ["bevy/3d_bevy_render"]
# Ambiance sonore sur `bevy_audio` (la synthèse elle-même, module `son`, est toujours compilée).
son = ["bevy/bevy_audio", "bevy/bevy_asset"]

[dependencies]
# Sans la feature `rendu` : uniquement de la logique, utilisable par le serveur dédié pour synchroniser la météo.
bevy = { workspace = true, features = ["std"] }

[dev-dependencies]
# Démo visuelle (`cargo run -p mcf_meteo --example demo_meteo`).
bevy = { workspace = true, features = ["3d", "pbr_light_textures"] }
# Banc d'essai GPU (`cargo bench-meteo`).
mcf_bench = { workspace = true }

[[example]]
name = "demo_meteo"
required-features = ["rendu"]

[[example]]
name = "demo_ocean"
required-features = ["rendu"]

[lints]
workspace = true

[[example]]
name = "demo_plage"
required-features = ["rendu"]

[[example]]
name = "bench_meteo"
required-features = ["rendu", "son"]

[[example]]
name = "verifier_fft"
required-features = ["rendu"]

[[example]]
name = "mesurer_ecume"
required-features = ["rendu"]
