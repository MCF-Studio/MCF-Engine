[package]
name = "mcf_editor"
description = "Éditeur MCF : scènes, scripts, animations, carte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Développement : Bevy en bibliothèque dynamique (recompilation bien plus rapide) + rechargement des assets.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]
# Pilotage par l'IA (pont MCP `mcf_mcp`, spec docs/SPEC_MCP_LSP_MOTEUR.md) : outil de développement, jamais dans un
# build distribué. Actif seulement avec l'option `--remote` au lancement.
remote = ["dep:getrandom", "dep:png", "dep:serde_json"]

[dependencies]
bevy = { workspace = true, features = ["3d", "ui"] }
bevy_egui.workspace = true
egui_dock.workspace = true
# Jeton de session du pilotage (aléa du système). MIT / Apache-2.0, déjà dans Cargo.lock.
getrandom = { version = "0.3", optional = true }
mcf_carte.workspace = true
mcf_core.workspace = true
mcf_geo.workspace = true
# Captures du pilotage, même version que mcf_carte.
png = { version = "0.18", optional = true }
rfd.workspace = true
serde_json = { workspace = true, optional = true }
winit.workspace = true

[lints]
workspace = true
